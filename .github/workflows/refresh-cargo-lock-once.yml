name: Refresh Cargo Lock Once

on:
  push:
    branches:
      - agent/fix-windows-smtc-p0
    paths:
      - '.github/workflows/refresh-cargo-lock-once.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Refresh lockfile and check Windows backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v5
        with:
          name: refreshed-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
