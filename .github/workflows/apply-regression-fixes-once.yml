name: Apply Regression Fixes Once

on:
  push:
    branches:
      - agent/fix-lyrics-loader-regression
    paths:
      - '.github/workflows/apply-regression-fixes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-lyrics-loader-regression
          fetch-depth: 0
      - name: Patch resolver
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'src/lib/player/url-resolver.js'
          const source = fs.readFileSync(path, 'utf8')
          const startMarker = '  // Phase 2: unblock 尝试（仍快速）'
          const endMarker = '  // Phase 3: 官方 match 解灰'
          const start = source.indexOf(startMarker)
          const end = source.indexOf(endMarker, start)
          if (start < 0 || end < 0) throw new Error('resolver phase markers not found')
          const block = [
            '  // Phase 2: unblock 尝试（仍快速）',
            '  if (candidates.length === 0) {',
            '    for (const level of fastTiers) {',
            '      const result = await fetchSongUrl(id, level, true, PLAYBACK.FAST_TIMEOUT, authOpts, signal)',
            '      if (!result) continue',
            '      if (result.isTrial) {',
            '        addCandidate(trialCandidates, result)',
            '        // Enhanced API 可能在普通请求返回 code=404 时，unblock=true 已经给出可读试听 URL。',
            '        // 拿到第一条就停止前台探测，避免继续等待 match/旧接口撞上 15s loading timeout。',
            "        firstUrlLevel = level + '+unblock'",
            '        break',
            '      } else {',
            '        addCandidate(candidates, result)',
            "        firstUrlLevel = level + '+unblock'",
            '        break',
            '      }',
            '    }',
            '  }',
            '',
            '  // Phase 2.5: unblock 已拿到可播放试听 URL 时立即出声。',
            '  if (candidates.length === 0 && trialCandidates.length > 0) {',
            '    trialCandidates.forEach(candidate => addCandidate(candidates, { ...candidate, cacheable: false }))',
            '  }',
            '',
          ].join('\n')
          fs.writeFileSync(path, source.slice(0, start) + block + source.slice(end))
          NODE
      - name: Commit resolver fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/player/url-resolver.js
          git diff --cached --check
          git commit -m "fix prioritize playable trial fallback"
          git push origin HEAD:agent/fix-lyrics-loader-regression
