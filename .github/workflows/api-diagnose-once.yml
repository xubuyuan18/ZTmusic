name: API Diagnose Once

on:
  push:
    branches:
      - agent/fix-lyrics-loader-regression
    paths:
      - '.github/workflows/api-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate unblock media URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const api = new URL('https://music.xubuyuan.top/song/url/v1')
          api.searchParams.set('id', '1956712935')
          api.searchParams.set('level', 'standard')
          api.searchParams.set('unblock', 'true')
          api.searchParams.set('randomCNIP', 'true')
          const headers = { 'User-Agent': 'zheting-api-diagnose', 'Referer': 'https://music.163.com/' }
          const response = await fetch(api, { headers })
          const data = await response.json()
          const item = data?.data?.[0]
          const mediaUrl = item?.url
          console.log('API_RESULT', JSON.stringify({ http: response.status, code: data?.code, itemCode: item?.code, hasUrl: !!mediaUrl, freeTrial: !!item?.freeTrialInfo, level: item?.level, type: item?.type }))
          if (!mediaUrl) process.exit(2)
          const parsed = new URL(mediaUrl)
          console.log('MEDIA_URL', JSON.stringify({ protocol: parsed.protocol, host: parsed.host, pathnameSuffix: parsed.pathname.slice(-80), hasQuery: !!parsed.search }))

          for (const method of ['HEAD', 'GET']) {
            const requestHeaders = { 'User-Agent': 'Mozilla/5.0', 'Referer': 'https://music.163.com/' }
            if (method === 'GET') requestHeaders.Range = 'bytes=0-1023'
            try {
              const res = await fetch(mediaUrl, { method, headers: requestHeaders, redirect: 'manual' })
              console.log('MEDIA_PROBE', JSON.stringify({ method, status: res.status, location: res.headers.get('location'), type: res.headers.get('content-type'), length: res.headers.get('content-length'), acceptRanges: res.headers.get('accept-ranges') }))
              if (method === 'GET') {
                const bytes = new Uint8Array(await res.arrayBuffer())
                console.log('MEDIA_BYTES', JSON.stringify({ count: bytes.length, first16: [...bytes.slice(0, 16)] }))
              }
            } catch (error) {
              console.log('MEDIA_ERROR', method, String(error))
            }
          }
          NODE
