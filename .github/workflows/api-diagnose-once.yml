name: API Diagnose Once

on:
  push:
    branches:
      - agent/fix-lyrics-loader-regression
    paths:
      - '.github/workflows/api-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect docs and current API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://music.xubuyuan.top'
          const headers = {
            'User-Agent': 'zheting-api-diagnose',
            'Referer': 'https://music.163.com/',
          }

          async function text(path) {
            const res = await fetch(new URL(path, base), { headers })
            const body = await res.text()
            console.log('TEXT', JSON.stringify({ path, status: res.status, type: res.headers.get('content-type'), length: body.length }))
            return body
          }

          for (const path of ['/docs/', '/docs/index.html', '/docs/README.md', '/docs/_sidebar.md']) {
            try {
              const body = await text(path)
              console.log(`DOC_${path.replaceAll('/', '_')}`, body.slice(0, 6000).replaceAll('\r', ''))
            } catch (error) {
              console.log('DOC_ERROR', path, String(error))
            }
          }

          const id = 1956712935
          for (const path of ['/lyric', '/lyric/new']) {
            const url = new URL(path, base)
            url.searchParams.set('id', String(id))
            const res = await fetch(url, { headers })
            const data = await res.json()
            console.log(path.toUpperCase(), JSON.stringify({
              status: res.status,
              code: data?.code,
              lrcSample: data?.lrc?.lyric?.split('\n').slice(0, 12) || [],
              tlyricSample: data?.tlyric?.lyric?.split('\n').slice(0, 8) || [],
              klyricSample: data?.klyric?.lyric?.split('\n').slice(0, 5) || [],
              yrcSample: data?.yrc?.lyric?.split('\n').slice(0, 5) || [],
            }))
          }
          NODE
