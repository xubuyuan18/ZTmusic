name: Apply Trial Match Budget Once

on:
  push:
    branches:
      - agent/fix-lyrics-loader-regression
    paths:
      - '.github/workflows/apply-trial-match-budget-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-lyrics-loader-regression
          fetch-depth: 0
      - name: Patch trial promotion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'src/lib/player/url-resolver.js'
          const source = fs.readFileSync(path, 'utf8')
          const oldBlock = [
            '  // Phase 2.5: unblock 已拿到可播放试听 URL 时立即出声。',
            '  if (candidates.length === 0 && trialCandidates.length > 0) {',
            '    trialCandidates.forEach(candidate => addCandidate(candidates, { ...candidate, cacheable: false }))',
            '  }',
          ].join('\n')
          const newBlock = [
            '  // Phase 2.5: 已有可播放试听 URL 时，只给 match 一个很短的完整音源机会。',
            '  // 快速 match 成功则保留原有“完整音源优先”；否则立即使用试听，避免撞上 15s loading timeout。',
            '  if (candidates.length === 0 && trialCandidates.length > 0) {',
            '    const matched = await fetchMatchedSongUrl(id, Math.min(PLAYBACK.FAST_TIMEOUT, 800), signal)',
            '    if (matched?.url) {',
            '      addCandidate(candidates, matched)',
            "      firstUrlLevel = 'match'",
            '    } else {',
            '      trialCandidates.forEach(candidate => addCandidate(candidates, { ...candidate, cacheable: false }))',
            '    }',
            '  }',
          ].join('\n')
          if (!source.includes(oldBlock)) throw new Error('trial promotion block not found')
          fs.writeFileSync(path, source.replace(oldBlock, newBlock))
          NODE
      - name: Commit resolver fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/player/url-resolver.js
          git diff --cached --check
          git commit -m "fix bound match lookup before trial playback"
          git push origin HEAD:agent/fix-lyrics-loader-regression
