name: Windows Playback Restore Installer Once

on:
  push:
    branches:
      - agent/fix-windows-smtc-p0
    paths:
      - '.github/workflows/windows-playback-restore-once.yml'

permissions:
  contents: read

concurrency:
  group: windows-playback-restore-once-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.1
  RUST_TOOLCHAIN: 1.88.0

jobs:
  build:
    name: Windows NSIS x64 Playback Restore
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64-pc-windows-msvc
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm tauri build --ci --verbose --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: zheting-windows-x64-pr7-playback-restore
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/**
          if-no-files-found: error
