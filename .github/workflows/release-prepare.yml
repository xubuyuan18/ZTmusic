name: Prepare Release

"on":
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump strategy'
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  actions: write
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Calculate version and create release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source before tagging
        run: pnpm verify

      - name: Calculate next version and changelog
        id: release
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          node <<'JS'
          const { execSync } = require('node:child_process')
          const fs = require('node:fs')

          function run(cmd, fallback = '') {
            try {
              return execSync(cmd, { encoding: 'utf8', stdio: ['pipe', 'pipe', 'ignore'] }).trim()
            } catch {
              return fallback
            }
          }

          const latestTag = run('git describe --tags --abbrev=0', 'v0.0.0')
          const versionMatch = latestTag.match(/^v(\d+)\.(\d+)\.(\d+)$/)
          if (!versionMatch) throw new Error(`Latest tag is not valid semver: ${latestTag}`)
          const [, majorText, minorText, patchText] = versionMatch
          const [major, minor, patch] = [majorText, minorText, patchText].map(Number)
          const sourceVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const sourceMatch = sourceVersion.match(/^\d+\.\d+\.\d+$/)
          if (!sourceMatch) throw new Error(`Source version is not valid semver: ${sourceVersion}`)
          const compareVersions = (left, right) => {
            const leftParts = left.split('.').map(Number)
            const rightParts = right.split('.').map(Number)
            for (let index = 0; index < 3; index++) {
              if (leftParts[index] !== rightParts[index]) return leftParts[index] - rightParts[index]
            }
            return 0
          }

          const range = latestTag === 'v0.0.0' ? 'HEAD' : `${latestTag}..HEAD`
          const log = run(`git log ${range} --pretty=format:%B%x00`)
          const commits = log ? log.split('\0').map(commit => commit.trim()).filter(Boolean) : []

          const groups = {
            feat: [],
            fix: [],
            docs: [],
            style: [],
            refactor: [],
            perf: [],
            test: [],
            chore: [],
            other: []
          }

          let hasBreaking = false

          for (const msg of commits) {
            const [line] = msg.split(/\r?\n/)
            const match = line.match(/^(feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?!?:\s*(.+)/)
            if (/(^|\n)BREAKING(?: CHANGE|-CHANGE):/m.test(msg)) hasBreaking = true
            if (match) {
              const [, type, , body] = match
              if (match[0].includes('!:')) hasBreaking = true
              ;(groups[type] || groups.other).push(body)
            } else {
              groups.other.push(line)
            }
          }

          const bump = process.env.BUMP === 'auto'
            ? (hasBreaking ? 'major' : groups.feat.length ? 'minor' : 'patch')
            : process.env.BUMP

          let nextMajor = major, nextMinor = minor, nextPatch = patch
          if (bump === 'major') { nextMajor++; nextMinor = 0; nextPatch = 0 }
          else if (bump === 'minor') { nextMinor++; nextPatch = 0 }
          else { nextPatch++ }

          const version = `${nextMajor}.${nextMinor}.${nextPatch}`
          if (compareVersions(version, sourceVersion) < 0) {
            throw new Error(`Refusing to downgrade source version ${sourceVersion} to ${version}`)
          }
          const tag = `v${version}`
          if (run(`git tag --list ${tag}`)) throw new Error(`Tag ${tag} already exists`)
          const date = new Date().toISOString().split('T')[0]

          const sections = []
          if (groups.feat.length) sections.push(`### 新增\n${groups.feat.map(c => `- ${c}`).join('\n')}`)
          if (groups.fix.length) sections.push(`### 修复\n${groups.fix.map(c => `- ${c}`).join('\n')}`)
          if (groups.perf.length) sections.push(`### 优化\n${groups.perf.map(c => `- ${c}`).join('\n')}`)
          if (groups.refactor.length) sections.push(`### 重构\n${groups.refactor.map(c => `- ${c}`).join('\n')}`)
          if (groups.docs.length) sections.push(`### 文档\n${groups.docs.map(c => `- ${c}`).join('\n')}`)
          if (groups.chore.length || groups.style.length || groups.test.length || groups.other.length) {
            const others = [...groups.chore, ...groups.style, ...groups.test, ...groups.other]
            sections.push(`### 其他\n${others.map(c => `- ${c}`).join('\n')}`)
          }

          const releaseNotes = sections.length ? sections.join('\n\n') : '### 其他\n- 日常维护与优化'

          let changelog = ''
          if (fs.existsSync('CHANGELOG.md')) {
            changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          } else {
            changelog = '# Changelog\n\n## [Unreleased]\n'
          }

          const newEntry = `## [${version}] - ${date}\n\n${releaseNotes}`
          if (!changelog.includes(`## [${version}] - `)) {
            if (!changelog.includes('## [Unreleased]')) {
              if (!/^## \[/m.test(changelog)) {
                throw new Error('CHANGELOG.md has no release section')
              }
              changelog = changelog.replace(/^## \[/m, '## [Unreleased]\n\n## [')
            }
            changelog = changelog.replace('## [Unreleased]', `## [Unreleased]\n\n${newEntry}`)
          }

          fs.writeFileSync('CHANGELOG.md', changelog)

          const ghOutput = process.env.GITHUB_OUTPUT
          fs.appendFileSync(ghOutput, `version=${version}\n`)
          fs.appendFileSync(ghOutput, `tag=${tag}\n`)
          fs.appendFileSync(ghOutput, `release_notes<<EOF\n${releaseNotes}\nEOF\n`)

          console.log(`Latest: ${latestTag}`)
          console.log(`Next: ${tag}`)
          console.log('--- Release Notes ---')
          console.log(releaseNotes)
          JS

      - name: Update version files
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          node <<'JS'
          const fs = require('node:fs')
          const version = process.env.VERSION

          const updateJsonVersion = (filePath) => {
            const text = fs.readFileSync(filePath, 'utf8')
            const pattern = /"version"\s*:\s*"[^"]+"/
            if (!pattern.test(text)) throw new Error(`Could not find version in ${filePath}`)
            const next = text.replace(pattern, `"version": "${version}"`)
            if (next !== text) fs.writeFileSync(filePath, next)
          }

          updateJsonVersion('package.json')
          updateJsonVersion('src-tauri/tauri.conf.json')
          JS

          python3 <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['VERSION']

          cargo_toml = Path('src-tauri/Cargo.toml')
          text = cargo_toml.read_text()
          text, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          if count != 1: raise SystemExit('Could not update Cargo.toml')
          cargo_toml.write_text(text)

          cargo_lock = Path('src-tauri/Cargo.lock')
          text = cargo_lock.read_text()
          pattern = r'(?ms)(\[\[package\]\]\nname = "zheting"\nversion = ")[^"]+("\n)'
          text, count = re.subn(pattern, rf'\g<1>{version}\2', text, count=1)
          if count != 1: raise SystemExit('Could not update Cargo.lock')
          cargo_lock.write_text(text)
          PY

      - name: Verify version sync
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs')
          const version = process.env.VERSION
          const pkg = JSON.parse(fs.readFileSync('package.json'))
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'))
          if (pkg.version !== version) throw new Error('package.json mismatch')
          if (tauri.version !== version) throw new Error('tauri.conf.json mismatch')
          JS
          grep -q "^version = \"$VERSION\"$" src-tauri/Cargo.toml
          pnpm check:versions

      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release files already prepared; tagging the current commit."
          else
            git commit -m "chore(release): $TAG"
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"
          gh workflow run build.yml --ref "$TAG" \
            -f build_windows=true \
            -f build_linux=true
