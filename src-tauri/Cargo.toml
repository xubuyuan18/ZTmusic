[package]
name = "zheting"
version = "1.3.0"
description = "A third-party Netease Cloud Music desktop client"
authors = ["xubuyuan18"]
license = "MIT"
repository = "https://github.com/xubuyuan18/ZTmusic"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
futures-lite = "2"
mpris-server = "0.10.0"

[target.'cfg(target_os = "windows")'.dependencies]
async-channel = "2"
windows = { version = "0.58", features = ["Media", "Media_Playback", "Media_Core", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 2
